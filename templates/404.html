<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>صفحة غير موجودة | PsychoAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              dark: {
                950: "#020617",
                900: "#0f172a",
                800: "#1e293b",
                700: "#334155",
              },
              brand: { 500: "#3b82f6", 600: "#2563eb" },
            },
            fontFamily: { cairo: ["Cairo", "sans-serif"] },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Cairo", sans-serif;
      }

      .glass-card {
        background: linear-gradient(
          145deg,
          rgba(30, 41, 59, 0.6) 0%,
          rgba(15, 23, 42, 0.8) 100%
        );
        border: 1px solid rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        transition: all 0.3s ease;
      }

      @keyframes float {
        0% {
          transform: translateY(0px);
        }

        50% {
          transform: translateY(-15px);
        }

        100% {
          transform: translateY(0px);
        }
      }

      .animate-float {
        animation: float 4s ease-in-out infinite;
      }
    </style>
  </head>

  <body
    class="bg-dark-950 text-gray-200 h-screen flex items-center justify-center overflow-hidden relative"
  >
    <div
      class="absolute top-1/4 left-1/4 w-96 h-96 bg-brand-600/20 rounded-full blur-[120px] pointer-events-none"
    ></div>
    <div
      class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-purple-600/10 rounded-full blur-[120px] pointer-events-none"
    ></div>

    <div
      class="glass-card p-8 md:p-12 rounded-3xl text-center max-w-md w-full mx-4 relative z-10 border border-white/10 shadow-2xl"
    >
      <div class="mb-8 relative">
        <h1
          class="text-9xl font-black text-transparent bg-clip-text bg-gradient-to-br from-brand-500 to-purple-500 animate-float drop-shadow-2xl select-none"
        >
          404
        </h1>
        <div
          class="absolute -bottom-6 left-1/2 -translate-x-1/2 w-40 h-6 bg-black/30 blur-xl rounded-[100%]"
        ></div>
      </div>

      <h2 class="text-2xl font-bold text-white mb-3">
        الصفحة تائهة في الفضاء!
      </h2>

      <p class="text-gray-400 mb-8 leading-relaxed text-sm md:text-base">
        عذراً، لم نستطع العثور على الصفحة التي تبحث عنها. <br />ربما تم نقلها أو
        حذفها نهائياً.
      </p>

      <div class="flex flex-col gap-3">
        <a
          href="/"
          class="group flex items-center justify-center gap-2 bg-brand-600 hover:bg-brand-500 text-white font-bold py-3.5 px-6 rounded-xl transition-all duration-300 shadow-lg shadow-brand-500/25 hover:shadow-brand-500/40 hover:-translate-y-1"
        >
          <i class="fas fa-home group-hover:scale-110 transition-transform"></i>
          <span>العودة للرئيسية</span>
        </a>

        <a
          href="javascript:history.back()"
          class="flex items-center justify-center gap-2 bg-white/5 hover:bg-white/10 text-gray-300 font-semibold py-3 px-6 rounded-xl transition border border-white/5 hover:border-white/10"
        >
          <i class="fas fa-arrow-right rtl:rotate-180"></i>
          <span>الرجوع للخلف</span>
        </a>
      </div>
    </div>

    <div
      class="absolute bottom-6 text-gray-600 text-xs text-center w-full opacity-50"
    >
      PsychoAI &copy; 2024 - جميع الحقوق محفوظة
    </div>
  </body>
</html>
