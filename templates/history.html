<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PsychoAI | السجل الزمني</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              dark: {
                950: "#020617",
                900: "#0f172a",
                800: "#1e293b",
                700: "#334155",
              },
              brand: { 500: "#3b82f6", 600: "#2563eb" },
              accent: { 400: "#38bdf8", 500: "#0ea5e9", 600: "#0284c7" },
              psycho: { low: "#10b981", mid: "#f59e0b", high: "#ef4444" },
            },
            fontFamily: { cairo: ["Cairo", "sans-serif"] },
          },
        },
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Cairo", sans-serif;
        background-color: #020617;
        background-image: radial-gradient(
            at 0% 0%,
            rgba(56, 189, 248, 0.1) 0px,
            transparent 50%
          ),
          radial-gradient(
            at 100% 100%,
            rgba(139, 92, 246, 0.1) 0px,
            transparent 50%
          );
        background-attachment: fixed;
      }

      .glass-panel {
        background: rgba(17, 24, 39, 0.7);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        transition: all 0.3s ease;
      }

      .glass-panel:hover {
        border-color: rgba(56, 189, 248, 0.3);
        box-shadow: 0 0 20px rgba(56, 189, 248, 0.1);
      }

      ::-webkit-scrollbar {
        width: 6px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 10px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }

      .slide-up {
        animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        opacity: 0;
        transform: translateY(20px);
      }

      @keyframes slideUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .line-clamp-2 {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
    </style>
  </head>

  <body class="bg-dark-950 text-gray-200 h-screen flex overflow-hidden">
    <div
      id="mobile-overlay"
      onclick="toggleSidebar()"
      class="fixed inset-0 bg-black/80 z-40 hidden backdrop-blur-sm transition-opacity md:hidden"
    ></div>

    <aside
      id="sidebar"
      class="fixed top-0 right-0 h-full w-64 bg-dark-900 border-l border-white/5 p-4 z-50 transform translate-x-full transition-transform duration-300 md:translate-x-0 md:relative md:flex md:flex-col shadow-2xl md:shadow-none"
    >
      <button
        onclick="toggleSidebar()"
        class="absolute top-4 left-4 text-gray-400 hover:text-white md:hidden"
      >
        <i class="fas fa-times text-xl"></i>
      </button>

      <div class="flex items-center gap-3 mb-8 px-2 mt-2 md:mt-0">
        <div
          class="w-8 h-8 rounded-lg bg-gradient-to-br from-brand-500 to-blue-700 flex items-center justify-center shadow-lg shadow-blue-500/20"
        >
          <i class="fas fa-brain text-white text-sm"></i>
        </div>
        <h1 class="text-xl font-bold tracking-wide text-white">
          Psycho<span class="text-brand-500">AI</span>
        </h1>
      </div>

      <nav class="space-y-2">
        <a
          href="/n/chat"
          class="flex items-center gap-3 hover:bg-white/5 text-gray-400 py-3 px-4 rounded-xl transition"
        >
          <i class="fas fa-comments w-5 text-center"></i>
          <span class="font-semibold text-sm">المحادثة</span>
        </a>
        <a
          href="/history"
          class="flex items-center gap-3 bg-brand-600/10 text-brand-500 py-3 px-4 rounded-xl border border-brand-500/20"
        >
          <i class="fas fa-history w-5 text-center"></i>
          <span class="font-semibold text-sm">السجل</span>
        </a>
        <a
          href="/settings"
          class="flex items-center gap-3 hover:bg-white/5 text-gray-400 py-3 px-4 rounded-xl transition"
        >
          <i class="fas fa-cog w-5 text-center"></i>
          <span class="font-semibold text-sm">الإعدادات</span>
        </a>
      </nav>

      <div class="mt-auto pt-4 border-t border-white/5 relative">
        <button
          onclick="toggleProfileMenu()"
          class="w-full flex items-center gap-3 px-2 opacity-70 hover:opacity-100 transition-opacity text-right bg-transparent border-0 p-0"
        >
          <div
            class="w-8 h-8 rounded-full bg-gray-700 flex items-center justify-center overflow-hidden shrink-0"
          >
            <img
              src="https://ui-avatars.com/api/?name=User&background=random"
              alt="User"
              class="w-full h-full object-cover"
            />
          </div>
          <div class="text-xs flex-1">
            <p class="text-white font-bold">{{name}}</p>
            <p class="text-gray-500">باقة عادية</p>
          </div>
          <i class="fas fa-chevron-up text-xs text-gray-500"></i>
        </button>

        <div
          id="profileMenu"
          class="absolute bottom-full right-0 w-full mb-2 bg-dark-800 border border-white/10 rounded-xl shadow-xl overflow-hidden hidden z-50"
        >
          <a
            href="/logout"
            class="flex items-center gap-3 px-4 py-3 text-red-400 hover:bg-white/5 transition text-sm font-bold"
          >
            <i class="fas fa-sign-out-alt"></i> تسجيل الخروج
          </a>
        </div>
      </div>
    </aside>

    <main class="flex-1 flex flex-col h-full overflow-hidden relative">
      <div
        class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0"
      >
        <div
          class="absolute top-[-20%] right-[20%] w-[30%] h-[30%] rounded-full bg-accent-500/5 blur-[120px]"
        ></div>
      </div>

      <div class="flex-1 overflow-y-auto z-10 p-4 md:p-8 lg:p-10 scroll-smooth">
        <div class="max-w-6xl mx-auto space-y-8">
          <header
            class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 slide-up"
            style="animation-delay: 0.1s"
          >
            <div class="flex items-center gap-4">
              <button
                onclick="toggleSidebar()"
                class="md:hidden text-white bg-white/10 p-2 rounded-lg hover:bg-white/20 transition"
              >
                <i class="fas fa-bars text-lg"></i>
              </button>
              <div>
                <h1 class="text-2xl md:text-3xl font-black text-white mb-2">
                  سجل الجلسات
                </h1>
                <p class="text-gray-400 text-sm">
                  تابع تطور حالتك النفسية واكتشف الأنماط.
                </p>
              </div>
            </div>
            <div class="flex gap-3">
              <button
                onclick="window.location.href='{{ url_for('download_history') }}'"
                class="glass-panel px-4 py-2 rounded-xl text-accent-400 hover:text-white hover:bg-accent-500 transition-colors"
              >
                <i class="fas fa-download"></i>
              </button>
            </div>
          </header>

          <div
            class="glass-panel p-6 rounded-3xl slide-up"
            style="animation-delay: 0.2s"
          >
            <h3 class="text-white font-bold mb-6 flex items-center gap-2">
              <i class="fas fa-chart-area text-accent-400"></i> المؤشرات النفسية
            </h3>
            <div class="relative w-full h-[300px]">
              <canvas id="historyChart"></canvas>
            </div>
          </div>

          <div class="space-y-4 slide-up" style="animation-delay: 0.3s">
            <h3 class="text-white font-bold text-lg mb-4">الجلسات السابقة</h3>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
              {% for session in sessions %}
              <a href="/p/chat?chpaV1={{session.cht_rr_tk}}">
                <div
                  class="glass-panel p-5 rounded-2xl group cursor-pointer hover:-translate-y-1 transition-transform duration-300"
                >
                  <div class="flex justify-between items-start mb-4">
                    <div>
                      <span class="text-xs text-gray-500 font-mono block"
                        >{{ session.date }}</span
                      >
                      <span class="text-white font-bold text-lg"
                        >{{ session.day }}</span
                      >
                    </div>
                    <span
                      class="px-3 py-1 rounded-lg text-xs font-bold border text-yellow-400 bg-yellow-400/10 border-yellow-400/20"
                    >
                      {{ session.danger }}
                    </span>
                  </div>

                  <p
                    class="text-gray-400 text-sm line-clamp-2 mb-4 leading-relaxed"
                  >
                    {{ session.usr_req }}
                  </p>

                  <div class="flex gap-2 mt-auto pt-4 border-t border-white/5">
                    <div class="flex-1 text-center">
                      <div class="text-[10px] text-gray-500 mb-1">قلق</div>
                      <div
                        class="h-1.5 w-full bg-dark-900 rounded-full overflow-hidden"
                      >
                        <div
                          class="h-full bg-blue-500"
                          style="width: {{ session.anxiety }}%"
                        ></div>
                      </div>
                    </div>
                    <div class="flex-1 text-center">
                      <div class="text-[10px] text-gray-500 mb-1">ضغط</div>
                      <div
                        class="h-1.5 w-full bg-dark-900 rounded-full overflow-hidden"
                      >
                        <div
                          class="h-full bg-purple-500"
                          style="width: {{ session.stress }}%"
                        ></div>
                      </div>
                    </div>
                    <div class="flex-1 text-center">
                      <div class="text-[10px] text-gray-500 mb-1">اكتئاب</div>
                      <div
                        class="h-1.5 w-full bg-dark-900 rounded-full overflow-hidden"
                      >
                        <div
                          class="h-full bg-red-500"
                          style="width: {{ session.depression }}%"
                        ></div>
                      </div>
                    </div>
                  </div>
                </div>
              </a>
              {% endfor %}
            </div>
          </div>
        </div>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>

    <script>


      const ctx = document.getElementById("historyChart").getContext("2d");

      new Chart(ctx, {
        type: "line",
        data: {
          labels: [{% for session in sessions|reverse %}"{{ session.day }}",{% endfor %}],
          datasets: [
            {
              label: "قلق",
              data: [{% for session in sessions|reverse %}{{ session.anxiety }},{% endfor %}],
              borderColor: "#3b82f6",
              backgroundColor: "rgba(59, 130, 246, 0.1)",
              borderWidth: 2,
              tension: 0.4,
              fill: true,
            },
            {
              label: "ضغط",
              data: [{% for session in sessions|reverse %}{{ session.stress }},{% endfor %}],
              borderColor: "#a855f7",
              backgroundColor: "rgba(168, 85, 247, 0.05)",
              borderWidth: 2,
              tension: 0.4,
              fill: true,
            },
            {
              label: "اكتئاب",
              data: [{% for session in sessions|reverse %}{{ session.depression }},{% endfor %}],
              borderColor: "#ef4444",
              backgroundColor: "rgba(239, 68, 68, 0.05)",
              borderWidth: 2,
              tension: 0.4,
              borderDash: [5, 5],
              fill: false,
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: "top",
              align: "end",
              labels: {
                color: "#94a3b8",
                font: { family: "Cairo" },
                usePointStyle: true,
                boxWidth: 6,
              },
            },
            tooltip: {
              mode: "index",
              intersect: false,
              backgroundColor: "rgba(15, 23, 42, 0.9)",
              titleFont: { family: "Cairo" },
              bodyFont: { family: "Cairo" },
              borderColor: "rgba(255,255,255,0.1)",
              borderWidth: 1,
            },
          },
          scales: {
            y: {
              beginAtZero: true,
              max: 10,
              grid: { color: "rgba(255, 255, 255, 0.05)" },
              ticks: { color: "#64748b" },
            },
            x: {
              grid: { display: false },
              ticks: { color: "#64748b", font: { family: "Cairo" } },
            },
          },
          interaction: {
            mode: "nearest",
            axis: "x",
            intersect: false,
          },
        },
      });

      function toggleSidebar() {
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("mobile-overlay");

        if (sidebar.classList.contains("translate-x-full")) {
          sidebar.classList.remove("translate-x-full");
          sidebar.classList.add("translate-x-0");
          overlay.classList.remove("hidden");
        } else {
          sidebar.classList.add("translate-x-full");
          sidebar.classList.remove("translate-x-0");
          overlay.classList.add("hidden");
        }
      }

      function toggleProfileMenu() {
        const menu = document.getElementById("profileMenu");
        menu.classList.toggle("hidden");
      }

      document.addEventListener("click", function (e) {
        const menu = document.getElementById("profileMenu");
        const btn = document.querySelector(
          'button[onclick="toggleProfileMenu()"]'
        );
        if (
          menu &&
          !menu.classList.contains("hidden") &&
          !menu.contains(e.target) &&
          !btn.contains(e.target)
        ) {
          menu.classList.add("hidden");
        }
      });
    </script>
  </body>
</html>
