<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل دخول المسؤول | PsychoAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              dark: {
                950: "#020617",
                900: "#0f172a",
                800: "#1e293b",
                700: "#334155",
              },
              brand: { 500: "#ef4444", 600: "#dc2626" }, // Red for Admin
              accent: { 500: "#eab308", 600: "#ca8a04" }, // Gold for Admin
            },
            fontFamily: { cairo: ["Cairo", "sans-serif"] },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Cairo", sans-serif;
        background-color: #020617;
        overflow-x: hidden;
      }

      .glass-card {
        background: linear-gradient(
          145deg,
          rgba(30, 41, 59, 0.4) 0%,
          rgba(15, 23, 42, 0.6) 100%
        );
        border: 1px solid rgba(239, 68, 68, 0.2);
        backdrop-filter: blur(20px);
        box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
      }

      .input-field {
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
        transition: all 0.3s ease;
      }

      .input-field:focus {
        border-color: #ef4444;
        box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.1);
        background: rgba(15, 23, 42, 0.9);
      }

      .glow-blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.3;
        z-index: -1;
        animation: pulse-glow 10s infinite alternate;
      }

      @keyframes pulse-glow {
        0% {
          transform: scale(1);
          opacity: 0.2;
        }

        100% {
          transform: scale(1.2);
          opacity: 0.4;
        }
      }

      .admin-badge {
        background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
    </style>
  </head>

  <body
    class="bg-dark-950 text-gray-200 min-h-screen flex items-center justify-center relative py-8 px-4"
  >
    <div
      class="glow-blob bg-red-900 w-96 h-96 top-0 right-0 -translate-y-1/2 translate-x-1/4"
    ></div>
    <div
      class="glow-blob bg-orange-900 w-96 h-96 bottom-0 left-0 translate-y-1/2 -translate-x-1/4"
    ></div>

    <div
      class="w-full max-w-[450px] glass-card rounded-3xl p-10 relative z-10 animate-[fadeIn_0.5s_ease-out]"
    >
      <div class="text-center mb-8">
        <div
          class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-br from-red-500 to-red-900 shadow-xl shadow-red-500/20 mb-6 border border-red-400/20"
        >
          <i class="fas fa-user-shield text-4xl text-white"></i>
        </div>
        <h1 class="text-3xl font-bold text-white mb-2">Admin Portal</h1>
        <p class="text-red-400/80 text-sm font-medium tracking-wide">
          لوحة تحكم المسؤول
        </p>
      </div>

      <form action="/admin-login" method="post" class="space-y-6">
        {% with messages = get_flashed_messages(with_categories=true) %} {% if
        messages %} {% for category, message in messages %}
        <div
          class="p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-sm text-center flex items-center justify-center gap-2"
        >
          <i class="fas fa-exclamation-circle"></i>
          {{ message }}
        </div>
        {% endfor %} {% endif %} {% endwith %}

        <div>
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
          <label
            class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2"
            >البريد الإلكتروني</label
          >
          <div class="relative">
            <div
              class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-gray-500"
            >
              <i class="fas fa-envelope text-sm"></i>
            </div>
            <input
              type="email"
              placeholder="admin@psychoai.com"
              class="input-field w-full rounded-xl py-3.5 pr-10 pl-4 text-white placeholder-gray-600 outline-none"
              name="email"
              required
            />
          </div>
        </div>

        <div>
          <label
            class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2"
            >كلمة المرور</label
          >
          <div class="relative">
            <div
              class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-gray-500"
            >
              <i class="fas fa-key text-sm"></i>
            </div>
            <input
              type="password"
              placeholder="••••••••"
              class="input-field w-full rounded-xl py-3.5 pr-10 pl-4 text-white placeholder-gray-600 outline-none"
              name="password"
              required
            />
          </div>
        </div>

        <button
          type="submit"
          class="w-full bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-red-900/40 transition transform hover:scale-[1.02] flex items-center justify-center gap-3"
        >
          <span>دخول آمن</span>
          <i class="fas fa-arrow-left"></i>
        </button>
      </form>

      <div class="mt-8 text-center">
        <a
          href="/"
          class="text-xs text-gray-600 hover:text-gray-400 transition flex items-center justify-center gap-2"
        >
          <i class="fas fa-long-arrow-alt-right"></i>
          العودة للصفحة الرئيسية
        </a>
      </div>
    </div>
  </body>
</html>
